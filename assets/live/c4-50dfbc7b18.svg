<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="Community Connect Four, game 1: RED'S TURN"><title>Community Connect Four, game 1: RED'S TURN</title>
