  .s{animation:s 3.5s ease-in-out infinite} @keyframes s{0%{transform:translateX(-420px)}100%{transform:translateX(1200px)}}
  .tw{animation:tw 3.5s ease-in-out infinite} @keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
