  <mask id="m"><rect width="1200" height="84" fill="url(#fade)"/></mask>
  <radialGradient id="pl" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fff"/><stop offset=".4" stop-color="#22d3ee"/><stop offset="1" stop-color="#0b0d1a"/></radialGradient></defs>
<style>
