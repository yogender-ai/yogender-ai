<svg xmlns="http://www.w3.org/2000/svg" width="850" height="230" viewBox="0 0 850 230">
  <defs>
    <!-- Aurora Gradient -->
    <linearGradient id="aurora" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f">
        <animate attributeName="stop-color" values="#0a0a0f;#0f0a1a;#0a0a0f" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="30%" style="stop-color:#1a0a2e">
        <animate attributeName="stop-color" values="#1a0a2e;#0a1a2e;#1a0a2e" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="60%" style="stop-color:#0a1a2e">
        <animate attributeName="stop-color" values="#0a1a2e;#1a0a2e;#0a1a2e" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#0a0a0f">
        <animate attributeName="stop-color" values="#0a0a0f;#0a0f1a;#0a0a0f" dur="9s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft Glow for Orbs -->
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Star Twinkle Filter -->
    <filter id="starGlow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes float1 { 0%,100% { transform: translate(0,0); opacity: 0.3; } 50% { transform: translate(30px,-15px); opacity: 0.6; } }
    @keyframes float2 { 0%,100% { transform: translate(0,0); opacity: 0.25; } 50% { transform: translate(-20px,10px); opacity: 0.5; } }
    @keyframes float3 { 0%,100% { transform: translate(0,0); opacity: 0.2; } 50% { transform: translate(15px,20px); opacity: 0.45; } }
    @keyframes twinkle { 0%,100% { opacity: 0; } 50% { opacity: 1; } }
    @keyframes twinkle2 { 0%,100% { opacity: 0.1; } 40% { opacity: 0.9; } 60% { opacity: 0.9; } }
    @keyframes slideIn { 0% { opacity: 0; transform: translateY(15px); } 100% { opacity: 1; transform: translateY(0); } }
    @keyframes lineGrow { 0% { width: 0; } 100% { width: 180px; } }
    @keyframes pulse { 0%,100% { opacity: 0.6; } 50% { opacity: 1; } }
    @keyframes meteor { 0% { transform: translate(0,0); opacity: 1; } 100% { transform: translate(-200px,100px); opacity: 0; } }

    .orb1 { animation: float1 12s ease-in-out infinite; }
    .orb2 { animation: float2 10s ease-in-out infinite; }
    .orb3 { animation: float3 14s ease-in-out infinite; }
    .star { animation: twinkle 3s ease-in-out infinite; }
    .star2 { animation: twinkle2 4s ease-in-out infinite; }
    .title { animation: slideIn 1s ease-out forwards; font-family: 'Segoe UI', sans-serif; }
    .subtitle { animation: slideIn 1s ease-out 0.3s forwards; opacity: 0; font-family: 'Segoe UI', sans-serif; }
    .line { animation: pulse 3s ease-in-out infinite; }
    .meteor-line { animation: meteor 3s linear infinite; }
  </style>

  <!-- Background -->
  <rect width="850" height="230" fill="url(#aurora)" rx="0"/>

  <!-- Subtle grid lines -->
  <g opacity="0.03" stroke="#ffffff" stroke-width="0.5">
    <line x1="0" y1="50" x2="850" y2="50"/>
    <line x1="0" y1="100" x2="850" y2="100"/>
    <line x1="0" y1="150" x2="850" y2="150"/>
    <line x1="0" y1="200" x2="850" y2="200"/>
    <line x1="100" y1="0" x2="100" y2="230"/>
    <line x1="200" y1="0" x2="200" y2="230"/>
    <line x1="300" y1="0" x2="300" y2="230"/>
    <line x1="400" y1="0" x2="400" y2="230"/>
    <line x1="500" y1="0" x2="500" y2="230"/>
    <line x1="600" y1="0" x2="600" y2="230"/>
    <line x1="700" y1="0" x2="700" y2="230"/>
    <line x1="800" y1="0" x2="800" y2="230"/>
  </g>

  <!-- Floating Aurora Orbs -->
  <circle class="orb1" cx="120" cy="80" r="80" fill="#7c3aed" opacity="0.15" filter="url(#softGlow)"/>
  <circle class="orb2" cx="650" cy="140" r="100" fill="#06b6d4" opacity="0.1" filter="url(#softGlow)"/>
  <circle class="orb3" cx="400" cy="200" r="60" fill="#ec4899" opacity="0.08" filter="url(#softGlow)"/>

  <!-- Stars / Particles -->
  <circle class="star" cx="80" cy="40" r="1.2" fill="#e2e8f0" filter="url(#starGlow)" style="animation-delay: 0s"/>
  <circle class="star2" cx="200" cy="30" r="0.8" fill="#c4b5fd" filter="url(#starGlow)" style="animation-delay: 0.5s"/>
  <circle class="star" cx="340" cy="55" r="1" fill="#e2e8f0" filter="url(#starGlow)" style="animation-delay: 1s"/>
  <circle class="star2" cx="500" cy="25" r="1.3" fill="#67e8f9" filter="url(#starGlow)" style="animation-delay: 1.5s"/>
  <circle class="star" cx="620" cy="45" r="0.9" fill="#e2e8f0" filter="url(#starGlow)" style="animation-delay: 2s"/>
  <circle class="star2" cx="750" cy="60" r="1.1" fill="#f9a8d4" filter="url(#starGlow)" style="animation-delay: 0.8s"/>
  <circle class="star" cx="150" cy="170" r="0.7" fill="#e2e8f0" filter="url(#starGlow)" style="animation-delay: 1.2s"/>
  <circle class="star2" cx="430" cy="190" r="1" fill="#c4b5fd" filter="url(#starGlow)" style="animation-delay: 2.2s"/>
  <circle class="star" cx="700" cy="180" r="0.8" fill="#e2e8f0" filter="url(#starGlow)" style="animation-delay: 0.3s"/>
  <circle class="star2" cx="300" cy="140" r="0.6" fill="#67e8f9" filter="url(#starGlow)" style="animation-delay: 1.7s"/>
  <circle class="star" cx="560" cy="100" r="1.1" fill="#f9a8d4" filter="url(#starGlow)" style="animation-delay: 2.5s"/>
  <circle class="star2" cx="810" cy="120" r="0.9" fill="#e2e8f0" filter="url(#starGlow)" style="animation-delay: 0.6s"/>

  <!-- Meteor streaks -->
  <g class="meteor-line" style="animation-delay: 0s" opacity="0.4">
    <line x1="780" y1="20" x2="760" y2="30" stroke="url(#aurora)" stroke-width="1.5"/>
    <line x1="780" y1="20" x2="760" y2="30" stroke="#c4b5fd" stroke-width="0.8"/>
  </g>
  <g class="meteor-line" style="animation-delay: 1.5s" opacity="0.3">
    <line x1="600" y1="15" x2="580" y2="25" stroke="#67e8f9" stroke-width="0.6"/>
  </g>

  <!-- Decorative Line -->
  <rect class="line" x="335" y="92" width="180" height="1.5" rx="1" fill="#7c3aed" opacity="0.6" filter="url(#glow)"/>

  <!-- Title Text -->
  <text class="title" x="425" y="82" text-anchor="middle" fill="#f1f5f9" font-size="42" font-weight="300" letter-spacing="8" filter="url(#glow)">
    YOGENDER
  </text>

  <!-- Subtitle -->
  <text class="subtitle" x="425" y="125" text-anchor="middle" fill="#94a3b8" font-size="13" letter-spacing="5" font-weight="300">
    AI ENGINEER  ·  FULL-STACK DEVELOPER  ·  CREATOR
  </text>

  <!-- Decorative Line Bottom -->
  <rect class="line" x="335" y="138" width="180" height="1.5" rx="1" fill="#06b6d4" opacity="0.4" filter="url(#glow)"/>

  <!-- Status indicators -->
  <g transform="translate(355, 165)">
    <circle r="3" fill="#22c55e" opacity="0.8" filter="url(#starGlow)">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="12" y="4" fill="#64748b" font-size="10" font-family="'Segoe UI', sans-serif" letter-spacing="2">OPEN TO COLLABORATE</text>
  </g>

  <!-- Bottom fade -->
  <rect y="210" width="850" height="20" fill="url(#aurora)" opacity="0.5"/>
</svg>
