<svg xmlns="http://www.w3.org/2000/svg" width="850" height="120" viewBox="0 0 850 120">
  <defs>
    <linearGradient id="footGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="50%" stop-color="#1a0a2e">
        <animate attributeName="stop-color" values="#1a0a2e;#0a1a2e;#1a0a2e" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </linearGradient>
    <filter id="fGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulse2 { 0%,100% { opacity:0.3; } 50% { opacity:0.7; } }
    @keyframes dash { 0% { stroke-dashoffset: 1000; } 100% { stroke-dashoffset: 0; } }
    .ft { font-family: 'Segoe UI', sans-serif; }
  </style>

  <rect width="850" height="120" fill="url(#footGrad)"/>

  <!-- Decorative line -->
  <line x1="250" y1="30" x2="600" y2="30" stroke="#7c3aed" stroke-width="0.5" opacity="0.3" stroke-dasharray="4 8" style="animation: dash 20s linear infinite"/>

  <!-- Heart icon path -->
  <g transform="translate(405, 55)" filter="url(#fGlow)">
    <path d="M0-6 C-2-10,-8-10,-8-6 C-8-2,0,4,0,8 C0,4,8,-2,8,-6 C8,-10,2,-10,0,-6Z" fill="#ec4899" opacity="0.7" style="animation: pulse2 2s ease-in-out infinite"/>
  </g>

  <text class="ft" x="425" y="85" text-anchor="middle" fill="#64748b" font-size="11" letter-spacing="3" font-weight="300">
    CRAFTED WITH PASSION  ·  INDIA 🇮🇳
  </text>

  <text class="ft" x="425" y="105" text-anchor="middle" fill="#475569" font-size="9" letter-spacing="2">
    © 2026 YOGENDER  ·  ALL RIGHTS RESERVED
  </text>
</svg>
