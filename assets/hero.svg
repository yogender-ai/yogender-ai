<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Yogender — AI/ML Engineer · Full-Stack Builder"><title>Yogender — AI/ML Engineer · Full-Stack Builder</title>
<defs>
  <linearGradient id="name" x1="0" x2="1" y1="0" y2="0" spreadMethod="reflect">
    <stop offset="0" stop-color="#8b5cf6"/><stop offset=".35" stop-color="#22d3ee"/>
    <stop offset=".7" stop-color="#f472b6"/><stop offset="1" stop-color="#8b5cf6"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="0 0;1 0;0 0" dur="8s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="floorfade" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity="1"/>
  </linearGradient>
  <mask id="floormask"><rect x="0" y="285" width="1200" height="135" fill="url(#floorfade)"/></mask>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter>
  <filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/>
