name: Sync LeetCode Stats & Rebuild Assets

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"  # Every 6 hours
  push:
    branches: [main]
    paths:
      - ".github/scripts/**"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run LeetCode Sync & Rebuild Assets
        run: |
          python .github/scripts/sync_leetcode.py

      - name: Commit and push if changed
        run: |
          if [ -n "$(git status --porcelain README.md assets .github/scripts/leetcode_stats.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add README.md assets .github/scripts/leetcode_stats.json
            git commit -m "chore(stats): live sync LeetCode solve count and streak [skip ci]"
            git push
          fi
