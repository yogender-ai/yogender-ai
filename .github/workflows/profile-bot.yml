# Handles the interactive things on the profile:
#   "sign: ..."        -> puts the author's avatar in orbit on the galaxy (wall.py)
#   "c4: drop <1-7>"   -> plays one move of Community Connect Four (c4.py)
#
# Anything else is ignored, so ordinary issues are untouched.
name: Profile bot

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

# One move at a time: two people dropping a piece in the same second must not
# both read the same board.
concurrency:
  group: profile-bot
  cancel-in-progress: false

jobs:
  handle:
    if: startsWith(github.event.issue.title, 'sign:') || startsWith(github.event.issue.title, 'c4:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Values from the issue go through the environment, never interpolated
      # into a shell command. Issue-triggered workflows are the classic script
      # injection surface and a title is attacker-controlled text.
      - name: Join the galaxy
        if: startsWith(github.event.issue.title, 'sign:')
        env:
          SIGNER: ${{ github.event.issue.user.login }}
        run: |
          python .github/scripts/wall.py --add "$SIGNER"
          echo "RESULT=You're in orbit, @$SIGNER! 🪐 Your avatar is now a planet in the galaxy on the profile." >> "$GITHUB_ENV"

      - name: Play Connect Four
        if: startsWith(github.event.issue.title, 'c4:')
        env:
          TITLE: ${{ github.event.issue.title }}
          PLAYER: ${{ github.event.issue.user.login }}
        run: |
          set +e
          python .github/scripts/c4.py --title "$TITLE" --by "$PLAYER" --result /tmp/result.txt
          {
            echo "RESULT<<EOF"
            cat /tmp/result.txt
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Commit whatever changed
        env:
          WHO: ${{ github.event.issue.user.login }}
        run: |
          if [ -n "$(git status --porcelain assets data README.md)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add assets data README.md
            git commit -m "chore: $WHO touched the profile"
            # The stats bot may have pushed in the meantime.
            for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
          else
            echo "Nothing changed."
          fi

      - name: Reply and close
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.issue.number }}
          WHO: ${{ github.event.issue.user.login }}
        run: |
          gh issue comment "$NUMBER" --body "$RESULT

          Thanks for stopping by, @$WHO. 🐺 (The profile image can take a minute to refresh.)"
          gh issue close "$NUMBER"
